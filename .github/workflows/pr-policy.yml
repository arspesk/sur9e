name: PR policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Conventional Commit title
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request?.title ?? '';
            const pattern = /^(?!.*[\r\n])(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: \S[^\r\n]*$/;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" must follow Conventional Commits. Example: "feat(ui): add application filters".`,
              );
            }

  labels:
    name: Apply path labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label changed areas
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ github.token }}
