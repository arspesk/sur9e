name: Browser smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Fresh-clone Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      PLAYWRIGHT_SMOKE_MODE: "1"
      PLAYWRIGHT_START_SERVER: "1"
      PLAYWRIGHT_PORT: "3109"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3109
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run curated browser smoke
        run: >-
          ./node_modules/.bin/playwright test
          test/e2e/route-3width.spec.ts
          test/e2e/chat.spec.ts
          test/e2e/skip-link-focus.spec.ts

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
